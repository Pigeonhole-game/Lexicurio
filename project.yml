# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
name: Lexicurio
options:
  bundleIdPrefix: com.lexicurio
  deploymentTarget:
    iOS: "17.0"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "12.0.0"
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: "3.0.0"
targets:
  Lexicurio:
    type: application
    platform: iOS
    sources:
      - path: Lexicurio
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
      - sdk: GameKit.framework
      - sdk: StoreKit.framework
    entitlements:
      path: Lexicurio/Lexicurio.entitlements
      properties:
        com.apple.developer.game-center: true
    info:
      path: Lexicurio/Info.plist
      properties:
        CFBundleDisplayName: Lexicurio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Google's public TEST app ID. Replace with your own AdMob app ID before release.
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        NSUserTrackingUsageDescription: Lexicurio uses this to show ads that are more relevant to you. Upgrade to Lexicurio Pro to remove ads.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lexicurio.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        OTHER_LDFLAGS: ["-ObjC"]
    scheme:
      storeKitConfiguration: Lexicurio/Store/Lexicurio.storekit
